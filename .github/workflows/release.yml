# Publishes to PyPI with Trusted Publishing (OIDC) when a `v*` tag is pushed.
# Publishing is opt-in (see the publish job); without it a tag only builds and smoke-tests.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel
        run: uvx --from dist/*.whl amber --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    # opt-in: set the repository variable PYPI_PUBLISH=true after configuring the PyPI trusted
    # publisher (project amber-compiler, workflow release.yml, environment pypi)
    if: vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
